<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#455a64"/></marker><style>text{font-family:Arial,sans-serif;fill:#172b3a}.title{font-size:34px;font-weight:700}.head{font-size:27px;font-weight:700}.body{font-size:22px}.small{font-size:18px}.box{rx:20;ry:20;stroke-width:3}.arrow{stroke:#455a64;stroke-width:5;fill:none;marker-end:url(#arr)}</style></defs>
<rect width="1600" height="900" fill="#ffffff"/><text x="800" y="55" text-anchor="middle" class="title">Value pathways for coal-mine waste rock in Quang Ninh</text>
<rect x="570" y="95" width="460" height="110" fill="#e9eef2" stroke="#536878" class="box"/><text x="800" y="138" text-anchor="middle" class="head">S0 · Stored waste-rock dump</text><text x="800" y="174" text-anchor="middle" class="body">Common feedstock; status-quo management</text>
<path d="M690 205 C590 250 440 250 400 300" class="arrow"/><path d="M910 205 C1010 250 1160 250 1200 300" class="arrow"/>
<rect x="95" y="300" width="620" height="390" fill="#eaf3fb" stroke="#145b8f" stroke-width="5" class="box"/><text x="405" y="348" text-anchor="middle" class="head">S1 · External fill supply</text><text x="405" y="392" text-anchor="middle" class="body">Recovery → sorting/crushing → dump trucks</text><text x="405" y="438" text-anchor="middle" class="body">Delivered to project; sensitive to price and distance</text><rect x="145" y="480" width="520" height="150" fill="#fff" stroke="#2774a8" class="box"/><text x="405" y="523" text-anchor="middle" class="head">Quantitatively modelled in this study</text><text x="405" y="562" text-anchor="middle" class="body">FNPV; FBCR; break-even thresholds</text><text x="405" y="598" text-anchor="middle" class="body">and model-conditional S1 risk</text>
<rect x="885" y="300" width="620" height="390" fill="#e9f5ee" stroke="#3a8659" stroke-dasharray="12 8" class="box"/><text x="1195" y="348" text-anchor="middle" class="head">S2 · In-mine hydraulic backfilling</text><text x="1195" y="392" text-anchor="middle" class="body">Waste rock + fly ash + water → mix/pump/pipeline</text><text x="1195" y="438" text-anchor="middle" class="body">Goaf; selected abandoned roadways if approved</text><rect x="935" y="480" width="520" height="150" fill="#fff" stroke="#3a8659" stroke-dasharray="12 8" class="box"/><text x="1195" y="523" text-anchor="middle" class="head">Published technical evidence</text><text x="1195" y="562" text-anchor="middle" class="body">Local laboratory-scale tests</text><text x="1195" y="598" text-anchor="middle" class="body">No field costs / NPV available</text>
<rect x="300" y="755" width="1000" height="90" fill="#fff7e6" stroke="#bd8a25" class="box"/><text x="800" y="793" text-anchor="middle" class="head">S3 · Precast components for mine use</text><text x="800" y="825" text-anchor="middle" class="small">Product-development route; insufficient reproducible performance and cost data for economic comparison</text>
<text x="800" y="238" text-anchor="middle" class="small">Solid outline: S1 quantified cash flow · Dashed outline: S2 qualitative technical and operational appraisal</text><text x="800" y="265" text-anchor="middle" class="small">Grey and gold boxes: status-quo reference and product-development option</text><path d="M800 205 L800 735" stroke="#9aa7ae" stroke-width="2" stroke-dasharray="8,10"/><text x="800" y="715" text-anchor="middle" class="small">S1 and S2 are not directly comparable because their functional units, costs, and outputs differ</text>
</svg>